<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>War Generation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- MENU -->
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <h1 class="game-title">⚔️ War Generation ⚔️</h1>
      <input type="text" id="player-name" placeholder="Votre nom..." maxlength="20">

      <button id="btn-play" class="btn-primary">🌐 Multijoueur 1v1</button>

      <div class="solo-section">
        <p class="solo-label">🤖 Jouer contre l'IA</p>
        <div class="difficulty-buttons">
          <button class="btn-diff" data-diff="easy">😊 Facile</button>
          <button class="btn-diff" data-diff="normal">😐 Normal</button>
          <button class="btn-diff" data-diff="hard">😠 Difficile</button>
          <button class="btn-diff" data-diff="impossible">💀 Impossible</button>
        </div>
      </div>

      <div id="queue-status" class="hidden">
        <div class="spinner"></div>
        <p>Recherche d'un adversaire...</p>
      </div>
    </div>
  </div>

  <!-- JEU -->
  <div id="game-screen" class="screen">
    <div id="hud-top">
      <div class="player-info left">
        <span class="pname" id="p1-name">J1</span>
        <div class="hp-bar"><div class="hp-fill p1fill" id="p1-hp-bar"></div><span class="hp-text" id="p1-hp-text"></span></div>
        <span class="age-badge p1badge" id="p1-age">Age 0</span>
      </div>
      <div id="game-timer"><span id="timer-text">0:00</span></div>
      <div class="player-info right">
        <span class="pname p2n" id="p2-name">J2</span>
        <div class="hp-bar"><div class="hp-fill p2fill" id="p2-hp-bar"></div><span class="hp-text" id="p2-hp-text"></span></div>
        <span class="age-badge p2badge" id="p2-age">Age 0</span>
      </div>
    </div>

    <canvas id="game-canvas" width="1200" height="500"></canvas>

    <div id="hud-bottom">
      <div id="gold-display">💰 <span id="gold-amount">200</span></div>

      <div id="unit-buttons">
        <button class="ubtn" data-type="MELEE" id="btn-melee">
          <span class="uicon">⚔️</span><span class="uname">Melee</span><span class="ucost">50g</span><span class="hkey">[1]</span>
        </button>
        <button class="ubtn" data-type="RANGED" id="btn-ranged">
          <span class="uicon">🏹</span><span class="uname">Ranged</span><span class="ucost">75g</span><span class="hkey">[2]</span>
        </button>
        <button class="ubtn" data-type="TANK" id="btn-tank">
          <span class="uicon">🛡️</span><span class="uname">Tank</span><span class="ucost">150g</span><span class="hkey">[3]</span>
        </button>
      </div>

      <div id="turret-buttons">
        <button class="tbtn" id="btn-turret-0">🔒 Slot 1 (50g)<span class="hkey">[Q]</span></button>
        <button class="tbtn" id="btn-turret-1">🔒 Slot 2 (150g)<span class="hkey">[W]</span></button>
        <button class="tbtn" id="btn-turret-2">🔒 Slot 3 (500g)<span class="hkey">[E]</span></button>
      </div>

      <div id="special-buttons">
        <button class="sbtn" id="btn-upgrade-age">⬆️ Évoluer<span class="scost" id="upgrade-cost">500g</span><span class="hkey">[R]</span></button>
        <button class="sbtn" id="btn-special">💥 Spécial<span class="scost">500g</span><span class="hkey">[F]</span></button>
      </div>

      <div id="training-queue"><span class="qlabel">🔧</span><div id="queue-items"></div></div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-screen" class="screen">
    <div class="go-container">
      <h1 id="gameover-title"></h1>
      <p id="gameover-reason"></p>
      <button id="btn-rematch" class="btn-primary">🔄 Rejouer</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/network.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
