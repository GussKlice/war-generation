<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wargeneration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <!-- ÉCRAN MENU -->
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <h1 class="game-title">⚔️ Wargeneration ⚔️</h1>
      <div class="menu-form">
        <input type="text" id="player-name" placeholder="Votre nom..." maxlength="20">
        <button id="btn-play" class="btn-primary">🎮 Jouer</button>
      </div>
      <div id="queue-status" class="hidden">
        <div class="spinner"></div>
        <p>Recherche d'un adversaire...</p>
      </div>
    </div>
  </div>
  
  <!-- ÉCRAN JEU -->
  <div id="game-screen" class="screen">
    <!-- HUD Supérieur -->
    <div id="hud-top">
      <div id="player1-info" class="player-info left">
        <span class="player-name" id="p1-name">Joueur 1</span>
        <div class="hp-bar">
          <div class="hp-fill" id="p1-hp-bar"></div>
          <span class="hp-text" id="p1-hp-text">1000/1000</span>
        </div>
        <span class="age-badge" id="p1-age">Âge de Pierre</span>
      </div>
      
      <div id="game-timer">
        <span id="timer-text">0:00</span>
      </div>
      
      <div id="player2-info" class="player-info right">
        <span class="player-name" id="p2-name">Joueur 2</span>
        <div class="hp-bar">
          <div class="hp-fill" id="p2-hp-bar"></div>
          <span class="hp-text" id="p2-hp-text">1000/1000</span>
        </div>
        <span class="age-badge" id="p2-age">Âge de Pierre</span>
      </div>
    </div>
    
    <!-- Canvas du jeu -->
    <canvas id="game-canvas" width="1200" height="400"></canvas>
    
    <!-- HUD Inférieur - Contrôles -->
    <div id="hud-bottom">
      <div id="gold-display">
        💰 <span id="gold-amount">200</span>
      </div>
      
      <div id="unit-buttons">
        <button class="unit-btn" data-type="MELEE" id="btn-melee">
          <span class="unit-icon">⚔️</span>
          <span class="unit-name">Melee</span>
          <span class="unit-cost">50g</span>
          <span class="hotkey">[1]</span>
        </button>
        <button class="unit-btn" data-type="RANGED" id="btn-ranged">
          <span class="unit-icon">🏹</span>
          <span class="unit-name">Ranged</span>
          <span class="unit-cost">75g</span>
          <span class="hotkey">[2]</span>
        </button>
        <button class="unit-btn" data-type="TANK" id="btn-tank">
          <span class="unit-icon">🛡️</span>
          <span class="unit-name">Tank</span>
          <span class="unit-cost">150g</span>
          <span class="hotkey">[3]</span>
        </button>
      </div>
      
      <div id="action-buttons">
        <button class="action-btn" id="btn-turret-0">
          🗼 Tourelle 1
          <span class="hotkey">[Q]</span>
        </button>
        <button class="action-btn" id="btn-turret-1">
          🗼 Tourelle 2
          <span class="hotkey">[W]</span>
        </button>
        <button class="action-btn" id="btn-turret-2">
          🗼 Tourelle 3
          <span class="hotkey">[E]</span>
        </button>
      </div>
      
      <div id="special-buttons">
        <button class="special-btn" id="btn-upgrade-age">
          ⬆️ Évoluer
          <span class="upgrade-cost" id="upgrade-cost">500g</span>
          <span class="hotkey">[R]</span>
        </button>
        <button class="special-btn" id="btn-special">
          💥 Spécial
          <span class="upgrade-cost">500g</span>
          <span class="hotkey">[F]</span>
        </button>
      </div>
      
      <!-- Queue d'entraînement -->
      <div id="training-queue">
        <div class="queue-label">🔧 Entraînement:</div>
        <div id="queue-items"></div>
      </div>
    </div>
  </div>
  
  <!-- ÉCRAN FIN DE PARTIE -->
  <div id="gameover-screen" class="screen">
    <div class="gameover-container">
      <h1 id="gameover-title">Victoire !</h1>
      <p id="gameover-reason"></p>
      <button id="btn-rematch" class="btn-primary">🔄 Rejouer</button>
    </div>
  </div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/network.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
